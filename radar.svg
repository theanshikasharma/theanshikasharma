<svg width="100%" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="sweepGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="260" fill="url(#bg)"/>

  <g transform="translate(130,130)">
    <circle r="100" fill="none" stroke="#138808" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle r="70" fill="none" stroke="#138808" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle r="40" fill="none" stroke="#138808" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#138808" stroke-opacity="0.3"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#138808" stroke-opacity="0.3"/>

    <path d="M0 0 L100 0 A100 100 0 0 1 70.71 70.71 Z" fill="url(#sweepGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </path>

    <circle cx="45" cy="-30" r="4" fill="#FF9933">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="-60" cy="20" r="4" fill="#FF9933">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="20" cy="70" r="4" fill="#FF9933">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="2.6s"/>
    </circle>

    <circle r="3" fill="#F5F0E1"/>
  </g>

  <text x="280" y="100" fill="#F5F0E1" font-family="Fira Code, monospace" font-size="20" font-weight="bold">SCANNING FOR OPPORTUNITIES</text>
  <text x="280" y="130" fill="#8A9A5B" font-family="Fira Code, monospace" font-size="14">▸ Backend Systems Engineering</text>
  <text x="280" y="152" fill="#8A9A5B" font-family="Fira Code, monospace" font-size="14">▸ Secure Authentication &amp; APIs</text>
  <text x="280" y="174" fill="#8A9A5B" font-family="Fira Code, monospace" font-size="14">▸ Scalable Distributed Systems</text>

  <text x="280" y="210" fill="#FF9933" font-family="Fira Code, monospace" font-size="13">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    STATUS: ONLINE
  </text>
</svg>
